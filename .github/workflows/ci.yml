name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint-and-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check zscale
        run: ffmpeg -hide_banner -filters | grep -q zscale
      - name: Install deps
        run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check scripts --select E,F,W --ignore E501
      - name: Smoke (no API keys)
        run: bash tests/smoke.sh
